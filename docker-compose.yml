services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: freshroute_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-freshroute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-freshroute}
      POSTGRES_DB: ${POSTGRES_DB:-freshroute}
    ports:
      # 5433 on host to avoid clashing with a local Postgres install.
      - "5433:5432"
    volumes:
      - freshroute_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-freshroute} -d ${POSTGRES_DB:-freshroute}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # OSRM routing — run scripts/osrm_bootstrap.sh once first, then:
  #   docker compose --profile osrm up -d osrm

  osrm-preprocess:
    image: osrm/osrm-backend:latest
    container_name: freshroute_osrm_preprocess
    profiles: ["osrm-bootstrap"]
    volumes:
      - ./data/osrm:/data
    entrypoint: ["/bin/sh", "-c"]
    command: ["echo 'Use scripts/osrm_bootstrap.sh to run preprocessing steps.'"]

  osrm:
    image: osrm/osrm-backend:latest
    container_name: freshroute_osrm
    profiles: ["osrm"]
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./data/osrm:/data:ro
    command: [
      "osrm-routed",
      "--algorithm", "mld",
      "--max-table-size", "5000",
      "/data/india-latest.osrm"
    ]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/route/v1/driving/77.5946,12.9716;77.6412,12.9611"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  freshroute_db:
