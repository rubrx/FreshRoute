[project]
name = "freshroute-backend"
version = "0.1.0"
description = "FreshRoute backend — ingestion, forecasting, freshness, decision, API"
requires-python = ">=3.11"
dependencies = [
    # Data
    "pandas>=2.2",
    "pyarrow>=15.0",
    "numpy>=1.26",

    # Agmarknet SDK — primary historical data source (prices + arrivals).
    # v0.2.x exposes the `Agmarknet` client class; see agmarknet_client.py.
    "agmarknet>=0.2.2,<1.0",

    # HTTP + retries (for data.gov.in daily feed and future Open-Meteo/OSRM)
    "httpx>=0.27",
    "tenacity>=8.2",

    # DB
    "SQLAlchemy>=2.0",
    "psycopg2-binary>=2.9",

    # Config + CLI + logging
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "structlog>=24.1",

    # API (Phase 5 read-only scaffolding — powers the demo dashboard)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
freshroute = "backend.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
